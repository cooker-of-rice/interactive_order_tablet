<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Architect Kiosk 3.1 - Clean Basement</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            /* --- PALETA (Architectural Dark/Light) --- */
            --bg-dark: #0f172a;
            --bg-panel: #1e293b;
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.4);
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            
            /* --- MATERIÁLY --- */
            /* Standardní šrafování pro zdi */
            --wall-hatch: repeating-linear-gradient(45deg, #333, #333 1px, #94a3b8 1px, #94a3b8 3px);
            /* Betonové šrafování pro sklep */
            --concrete-hatch: repeating-linear-gradient(45deg, #475569, #475569 2px, #64748b 2px, #64748b 4px);
        }

        body {
            font-family: 'Outfit', sans-serif;
            margin: 0; padding: 0;
            background-color: #f1f5f9;
            height: 100vh;
            display: flex;
            overflow: hidden;
            user-select: none;
        }

        /* --- UI: INTRO --- */
        #intro-page {
            position: absolute; inset: 0; z-index: 50;
            background: var(--bg-dark);
            color: white;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background-image: radial-gradient(circle at top right, #334155 0%, transparent 40%);
        }
        .hero-title {
            font-size: 5rem; font-weight: 800; line-height: 1; letter-spacing: -2px;
            background: linear-gradient(to right, #fff, #94a3b8);
            -webkit-background-clip: text; background-clip: text; color: transparent;
            margin-bottom: 1rem;
        }
        .hero-btn {
            margin-top: 3rem; padding: 1.5rem 4rem; font-size: 1.5rem; font-weight: 700;
            background: var(--accent); color: white; border: none; border-radius: 8px;
            box-shadow: 0 0 30px var(--accent-glow); cursor: pointer;
            transition: all 0.3s; text-transform: uppercase; letter-spacing: 1px;
        }
        .hero-btn:active { transform: scale(0.95); }

        /* --- UI: HLAVNÍ ROZLOŽENÍ --- */
        .app-layout {
            display: flex; width: 100%; height: 100%;
            opacity: 0; pointer-events: none; transition: opacity 0.5s;
        }
        .app-layout.active { opacity: 1; pointer-events: all; }

        /* LEVÝ PANEL */
        .sidebar {
            width: 400px; background: var(--bg-panel); color: var(--text-light);
            display: flex; flex-direction: column; padding: 2rem; box-shadow: 10px 0 30px rgba(0,0,0,0.2);
            z-index: 20;
        }
        .sidebar h2 { margin-top: 0; border-bottom: 1px solid #334155; padding-bottom: 1rem; }
        .control-group { margin-bottom: 1.5rem; }
        .control-group label { display: block; color: var(--text-muted); font-size: 0.9rem; text-transform: uppercase; margin-bottom: 0.5rem; font-weight: 600;}
        select, input {
            width: 100%; padding: 1rem; background: #334155; border: 2px solid transparent;
            color: white; border-radius: 6px; font-size: 1.1rem;
            box-sizing: border-box;
        }
        select:focus, input:focus { outline: none; border-color: var(--accent); background: #0f172a; }
        .btn-action {
            margin-top: auto; width: 100%; padding: 1.2rem; background: var(--accent); color: white;
            border: none; border-radius: 6px; font-weight: 700; font-size: 1.1rem; cursor: pointer; text-transform: uppercase;
        }

        /* PRAVÝ PANEL (PREVIEW) */
        .main-stage {
            flex: 1; position: relative; background: #e2e8f0;
            display: flex; flex-direction: column; overflow: hidden;
        }
        .sky-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 60%;
            background: linear-gradient(to bottom, #dbeafe 0%, #e2e8f0 100%);
            z-index: 0;
        }

        /* STRÁNKY OBSAHU */
        .page-content { display: none; width: 100%; height: 100%; flex-direction: column; position: relative; z-index: 10; animation: fadeUp 0.4s ease-out; }
        .page-content.active { display: flex; }

        /* KARTY PATER */
        .floors-grid { padding: 3rem; overflow-y: auto; display: grid; gap: 1rem; align-content: start; max-width: 900px; margin: 0 auto; width: 100%; }
        .floor-card {
            background: white; padding: 1.5rem; border-radius: 8px;
            display: flex; align-items: center; justify-content: space-between;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); border-left: 6px solid #cbd5e1;
        }
        .floor-card.underground { background: #f1f5f9; border-left-color: #64748b; }
        .floor-title { font-weight: 800; font-size: 1.2rem; color: #1e293b; }
        .floor-select { width: auto; background: #f1f5f9; color: #0f172a; border: 1px solid #cbd5e1; }

        /* --- VIZUALIZACE DOMU (THE BLUEPRINT LOOK) --- */
        .preview-scroll-area {
            flex: 1; overflow-y: auto; overflow-x: hidden;
            display: flex; flex-direction: column; align-items: center;
            padding-top: 100px; padding-bottom: 200px; position: relative;
        }

        .house-structure {
            width: 500px; position: relative; display: flex; flex-direction: column;
            filter: drop-shadow(20px 20px 30px rgba(0,0,0,0.2));
            z-index: 10; /* Dům musí být nad zemí */
        }

        /* STŘECHA */
        .roof-segment {
            width: 0; height: 0; position: relative; z-index: 10; margin-bottom: -1px;
            border-bottom: 140px solid #334155; /* Břidlice */
            border-left: 280px solid transparent; border-right: 280px solid transparent;
        }
        .roof-segment.plocha { width: 560px; height: 20px; border:none; background: #1e293b; border-radius: 4px;}

        /* PATRO */
        .floor-segment {
            width: 500px; height: 150px; background: #ffffff; /* Bílé pozadí interiéru */
            display: flex; position: relative; z-index: 5;
            /* Zdi */
            border-left: 15px solid transparent; border-right: 15px solid transparent;
            box-sizing: content-box; margin-left: -15px;
        }
        
        /* Šrafování zdí (Nadzemní) */
        .floor-segment::before, .floor-segment::after {
            content:''; position: absolute; top:0; bottom:0; width: 15px;
            background: var(--wall-hatch); border: 2px solid #0f172a; border-top: none; border-bottom: none;
        }
        .floor-segment::before { left: -15px; }
        .floor-segment::after { right: -15px; }

        /* --- OPRAVENÝ SKLEP (ČISTÝ BETON) --- */
        .floor-segment.underground {
            background: #e2e8f0; /* Světle šedý interiér (NE HNĚDÝ!) */
        }
        /* Tlusté betonové zdi pro sklep */
        .floor-segment.underground::before, .floor-segment.underground::after {
            width: 25px; 
            background: var(--concrete-hatch); /* Betonový vzor */
            border-color: #334155;
        }
        .floor-segment.underground::before { left: -25px; }
        .floor-segment.underground::after { right: -25px; }

        /* PODLAHA */
        .floor-slab {
            position: absolute; bottom: 0; left: -20px; right: -20px; height: 10px;
            background: #94a3b8; border: 2px solid #0f172a;
            z-index: 20;
        }

        /* ZEMĚ (POZADÍ) */
        .soil-backdrop {
            position: absolute; left: -100vw; width: 300vw; height: 3000px;
            background: linear-gradient(to bottom, #5d4037 0%, #281a16 100%); /* Hnědá do černé */
            border-top: 15px solid #16a34a; /* Tráva */
            z-index: 1; /* Pozadí! */
            pointer-events: none;
        }

        /* VYBAVENÍ */
        .room-visual { flex: 3; position: relative; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 10px;}
        .room-label {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 3rem; opacity: 0.05; font-weight: 900; text-transform: uppercase; pointer-events: none;
        }
        .furn-block { background: #334155; border-radius: 4px; position: relative; }
        .f-sofa { width: 120px; height: 40px; border-radius: 8px 8px 0 0; background: #475569; }
        .f-tv { width: 10px; height: 50px; background: #000; position: absolute; right: 20px; bottom: 40px;}
        .f-bed { width: 130px; height: 30px; background: #cbd5e1; }
        .f-bed-head { width: 10px; height: 50px; background: #94a3b8; position:absolute; left:0; bottom:0;}
        .f-car { width: 140px; height: 45px; background: #ef4444; border-radius: 20px 40px 0 0; opacity: 0.8;}
        .f-shelf { width: 100px; height: 80px; border: 4px solid #475569; border-bottom: none; display: flex; flex-direction: column; justify-content: space-evenly;}
        .f-shelf-row { height: 4px; background: #475569; width: 100%;}
        .f-stairs { width: 100%; height: 100%; background: repeating-linear-gradient(45deg, transparent, transparent 10px, #ccc 10px, #ccc 11px); }

        .shaft { flex: 1; border-left: 2px solid #0f172a; background: #f1f5f9; position: relative; overflow: hidden;}
        .elevator { width: 70%; height: 80%; background: var(--accent); margin: 10% auto; border-radius: 4px; box-shadow: 0 0 20px var(--accent);}

        /* CENA */
        .price-overlay {
            position: absolute; top: 2rem; right: 3rem;
            background: rgba(255,255,255,0.9); backdrop-filter: blur(10px);
            padding: 1rem 2rem; border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            text-align: right; z-index: 100;
        }

        @keyframes fadeUp { from {opacity:0; transform:translateY(20px);} to {opacity:1; transform:translateY(0);} }
    </style>
</head>
<body>

    <div id="intro-page">
        <div style="text-transform: uppercase; letter-spacing: 5px; opacity: 0.6; margin-bottom: 1rem;">Kiosk Configurator</div>
        <div class="hero-title">ARCHITECT<br>STUDIO</div>
        <button class="hero-btn" onclick="startApp()">Navrhnout Dům</button>
    </div>

    <div id="app-layout" class="app-layout">
        <div class="sidebar">
            <h2 id="sidebar-title">Nastavení</h2>
            <div id="global-controls">
                <div class="control-group">
                    <label>Konstrukce</label>
                    <select id="material"><option value="cihla">Cihlový blok</option><option value="beton">Monolit</option><option value="drevo">CLT Dřevo</option></select>
                </div>
                <div class="control-group">
                    <label>Střecha</label>
                    <select id="roof"><option value="sedlova">Sedlová</option><option value="plocha">Plochá</option></select>
                </div>
                <div class="control-group">
                    <label>Nadzemní patra</label>
                    <input type="number" id="floors-up" value="2" min="1" max="5">
                </div>
                <div class="control-group">
                    <label>Podzemní patra</label>
                    <input type="number" id="floors-down" value="1" min="0" max="2">
                </div>
                <button class="btn-action" onclick="goToFloors()">Další: Místnosti &rarr;</button>
            </div>

            <div id="rooms-controls" style="display:none; flex-direction:column; height:100%;">
                <div style="font-size:0.9rem; opacity:0.7; margin-bottom:1rem;">Krok 2/2: Definice pater</div>
                <div style="flex:1;"></div>
                <div style="display:flex; gap:10px; margin-top:20px;">
                    <button class="btn-action" style="background:#475569;" onclick="goBackToGlobal()">&larr; Zpět</button>
                    <button class="btn-action" onclick="buildVisualization()">Generovat &rarr;</button>
                </div>
            </div>
        </div>

        <div class="main-stage">
            <div class="sky-bg"></div>
            
            <div id="view-floors" class="page-content">
                <h1 style="text-align:center; margin-top:3rem; color:#0f172a; font-weight:800;">Konfigurace Místností</h1>
                <div id="floors-list" class="floors-grid"></div>
            </div>

            <div id="view-preview" class="page-content">
                <div class="price-overlay">
                    <div style="font-size:0.8rem; text-transform:uppercase; color:#64748b; font-weight:700;">Odhadovaná cena</div>
                    <div id="price-tag" style="font-size:2rem; font-weight:800; color:#0f172a;">0 Kč</div>
                </div>
                <div class="preview-scroll-area">
                    <div id="house-container" class="house-structure"></div>
                    <button class="hero-btn" style="margin-top:50px; font-size:1rem; padding:1rem 2rem; position:relative; z-index:100;" onclick="goToFloors()">Upravit návrh</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function startApp() {
            document.getElementById('intro-page').style.opacity = '0';
            setTimeout(() => { document.getElementById('intro-page').style.display = 'none'; document.getElementById('app-layout').classList.add('active'); }, 500);
        }

        function goToFloors() {
            document.getElementById('global-controls').style.display = 'none';
            document.getElementById('rooms-controls').style.display = 'flex';
            document.getElementById('sidebar-title').innerText = "Detail Pater";
            document.getElementById('view-preview').classList.remove('active');
            document.getElementById('view-floors').classList.add('active');
            renderFloorCards();
        }

        function goBackToGlobal() {
            document.getElementById('rooms-controls').style.display = 'none';
            document.getElementById('global-controls').style.display = 'block';
            document.getElementById('sidebar-title').innerText = "Nastavení";
        }

        function renderFloorCards() {
            const container = document.getElementById('floors-list');
            container.innerHTML = '';
            const up = parseInt(document.getElementById('floors-up').value);
            const down = parseInt(document.getElementById('floors-down').value);

            for (let i = up; i >= 1; i--) container.appendChild(createCard(i, false, i === 1 ? 'Přízemí (1.NP)' : `${i}. Nadzemní`));
            for (let i = 1; i <= down; i++) container.appendChild(createCard(-i, true, `${i}. Podzemní (Sklep)`));
        }

        function createCard(id, isUnderground, label) {
            const div = document.createElement('div');
            div.className = `floor-card ${isUnderground ? 'underground' : 'active-border'}`;
            div.dataset.id = id;
            div.innerHTML = `
                <div class="floor-title">${label}</div>
                <select class="floor-select room-selector">
                    <option value="obyvak">Obývací pokoj</option>
                    <option value="loznice" ${id > 1 ? 'selected' : ''}>Ložnice</option>
                    <option value="kuchyne">Kuchyně</option>
                    ${(id===1||isUnderground)?'<option value="garaz">Garáž</option>':''}
                    ${isUnderground?'<option value="sklad" selected>Sklad</option>':''}
                </select>`;
            return div;
        }

        function buildVisualization() {
            document.getElementById('view-floors').classList.remove('active');
            document.getElementById('view-preview').classList.add('active');
            const container = document.getElementById('house-container');
            container.innerHTML = '';

            const inputs = document.querySelectorAll('.floor-card');
            const roofType = document.getElementById('roof').value;
            const floorsUpCount = Array.from(inputs).filter(el => parseInt(el.dataset.id) > 0).length;
            const hasUnderground = Array.from(inputs).some(el => parseInt(el.dataset.id) < 0);

            // 1. Střecha
            const roof = document.createElement('div');
            roof.className = `roof-segment ${roofType}`;
            container.appendChild(roof);

            // 2. Země (na pozadí, vypočítaná pozice)
            if (hasUnderground) {
                const soil = document.createElement('div');
                soil.className = 'soil-backdrop';
                // 150px je výška patra, roofH je výška střechy
                const roofH = roofType === 'sedlova' ? 140 : 20;
                soil.style.top = (roofH + (floorsUpCount * 150)) + "px";
                container.appendChild(soil);
            }

            // 3. Patra
            const sortedInputs = Array.from(inputs).sort((a,b) => parseInt(b.dataset.id) - parseInt(a.dataset.id));
            let totalPrice = 2000000;

            sortedInputs.forEach(input => {
                const id = parseInt(input.dataset.id);
                const type = input.querySelector('.room-selector').value;
                const isUnderground = id < 0;

                const segment = document.createElement('div');
                segment.className = `floor-segment ${isUnderground ? 'underground' : ''}`;
                
                const room = document.createElement('div');
                room.className = 'room-visual';
                
                // Vybavení
                let furn = '';
                if(type === 'obyvak') furn = '<div class="f-sofa furn-block"></div><div class="f-tv furn-block"></div>';
                if(type === 'loznice') furn = '<div class="f-bed furn-block"><div class="f-bed-head"></div></div>';
                if(type === 'garaz') furn = '<div class="f-car"></div>';
                if(type === 'sklad') furn = '<div class="f-shelf"><div class="f-shelf-row"></div><div class="f-shelf-row"></div><div class="f-shelf-row"></div></div>';
                
                room.innerHTML = `<div class="room-label">${type}</div>` + furn;

                const shaft = document.createElement('div');
                shaft.className = 'shaft';
                shaft.innerHTML = id === 1 ? '<div class="elevator"></div>' : '<div class="f-stairs"></div>';

                const slab = document.createElement('div');
                slab.className = 'floor-slab';

                segment.appendChild(room);
                segment.appendChild(shaft);
                segment.appendChild(slab);
                container.appendChild(segment);

                totalPrice += isUnderground ? 650000 : 500000;
            });
            document.getElementById('price-tag').innerText = totalPrice.toLocaleString('cs-CZ') + " Kč";
        }
    </script>
</body>
</html>
